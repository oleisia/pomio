<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main>
    <h1>Pomio</h1>
    <p>A free, customizable Pomodoro focus dashboard.</p>

    <div id="timer-display" class="timer" role="timer" aria-label="Pomodoro time remaining">25:00</div>
    <div class="timer-controls">
      <button id="start-timer" type="button">Start</button>
      <button id="pause-timer" type="button" disabled>Pause</button>
      <button id="reset-timer" type="button">Reset</button>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
